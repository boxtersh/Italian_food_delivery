<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content auth-modal">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title" id="authModalLabel">Вход</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>

            <div class="modal-body pt-2">
                <div id="login-view">
                    <form id="login-form" novalidate>
                        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                        <div id="login-success" class="alert alert-success d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="login-email"
                                name="email"
                                placeholder="example@mail.ru"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="login-password" class="form-label">Пароль</label>
                            <input
                                type="password"
                                class="form-control"
                                id="login-password"
                                name="password"
                                placeholder="Введите пароль"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-dark w-100 auth-btn">
                            Войти
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        <span class="text-muted">Присоединяйтесь! </span>
                        <a href="#" id="show-register-link">Зарегистрироваться</a>
                    </div>
                </div>

                <div id="register-view" class="d-none">
                    <form id="register-form" novalidate>
                        <div id="register-error" class="alert alert-danger d-none" role="alert"></div>
                        <div id="register-success" class="alert alert-success d-none" role="alert"></div>

                        <div class="mb-3">
                            <label for="register-email" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="register-email"
                                name="email"
                                placeholder="example@mail.ru"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="register-name" class="form-label">Имя</label>
                            <input
                                type="text"
                                class="form-control"
                                id="register-name"
                                name="name"
                                placeholder="Ваше имя"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="register-phone" class="form-label">Телефон</label>
                            <input
                                type="text"
                                class="form-control"
                                id="register-phone"
                                name="phone"
                                placeholder="+79990000000 или 89990000000"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="register-password" class="form-label">Пароль</label>
                            <input
                                type="password"
                                class="form-control"
                                id="register-password"
                                name="password"
                                placeholder="Не менее 8 символов"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="register-password-confirm" class="form-label">Подтвердите пароль</label>
                            <input
                                type="password"
                                class="form-control"
                                id="register-password-confirm"
                                name="password_confirm"
                                placeholder="Повторите пароль"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-dark w-100 auth-btn">
                            Зарегистрироваться
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        <span class="text-muted">Уже есть аккаунт? </span>
                        <a href="#" id="show-login-link">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', path='js/auth.js') }}"></script>
