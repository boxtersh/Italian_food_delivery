<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Политика конфиденциальности</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/policy_confidence.css">
</head>
<body>
    <div class="banner">
        <img src="/static/images/uploads/policy_confidence/policy_confidence.webp"
             alt="Баннер политики конфиденциальности"
             class="banner-image">
    </div>

    <div class="pdf-container">
        <iframe src="/static/docs/policy_confidence.pdf"
                width="100%"
                height="730px">
            Ваш браузер не поддерживает PDF.
        </iframe>
        <div class="text-center mt-2">
            <a href="/static/docs/policy_confidence.pdf" class="btn btn-outline-secondary btn-sm">
                📥 Скачать файл
            </a>
        </div>
    </div>

    <div class="text-center mt-4">
        {% if request.query_params.get('from') == 'register' %}
            <a href="/?auth=register&return_from=policy" class="btn btn-dark">← Вернуться к регистрации</a>
        {% else %}
            <a href="/" class="btn btn-dark">← Вернуться на главную</a>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
